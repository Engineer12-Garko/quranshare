name: Drive Sync

# Runs the Google Drive -> QuranFlow catalog sync every 15 minutes.
#
# Why an external scheduler instead of Vercel Cron?
#   Vercel Cron on the Hobby plan only supports once-per-day schedules;
#   a sub-daily expression fails the whole deployment. This workflow keeps
#   the 15-minute cadence on any plan.
#
# Required repository configuration:
#   Secret: CRON_SECRET  -> must match the CRON_SECRET (or VERCEL_CRON_SECRET)
#                           environment variable on Vercel.
#   Variable (optional): SYNC_URL -> overrides the default production endpoint.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Never run two syncs at once; sync_drive() is idempotent but we avoid pile-ups.
concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Google Drive sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SYNC_URL: ${{ vars.SYNC_URL || 'https://quranshare-eta.vercel.app/api/v1/admin/sync/google-drive-cron' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is not set."
            exit 1
          fi

          http_code=$(curl -sS -o sync_response.json -w '%{http_code}' \
            --max-time 120 \
            -X POST "$SYNC_URL" \
            -H "x-vercel-cron: $CRON_SECRET" \
            -H "Content-Type: application/json")

          echo "HTTP $http_code"
          cat sync_response.json || true

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Drive sync failed with HTTP $http_code"
            exit 1
          fi

          if ! jq -e '.success == true' sync_response.json >/dev/null; then
            echo "::error::Drive sync endpoint returned an unsuccessful or invalid sync summary."
            exit 1
          fi
